<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Settings panel preview</title>
  <desc id="desc">Sanitized dashboard settings preview with symbol watchlist, risk sizing, and trading guards.</desc>
  <rect width="1200" height="675" fill="#08111f"/>
  <rect x="90" y="70" width="1020" height="535" rx="16" fill="#0c1728" stroke="#26364d"/>
  <rect x="650" y="70" width="460" height="535" rx="16" fill="#101b2c" stroke="#26364d"/>
  <text x="120" y="120" fill="#f8fbff" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Settings Preview</text>
  <text x="120" y="154" fill="#a8b5c7" font-family="Segoe UI, Arial, sans-serif" font-size="15">Public-safe illustration of configurable guardrails.</text>
  <g fill="#203049">
    <rect x="120" y="210" width="470" height="28" rx="5"/>
    <rect x="120" y="260" width="430" height="28" rx="5"/>
    <rect x="120" y="310" width="455" height="28" rx="5"/>
    <rect x="120" y="360" width="390" height="28" rx="5"/>
    <rect x="120" y="410" width="445" height="28" rx="5"/>
  </g>
  <text x="680" y="118" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">SETTINGS</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14">
    <text x="680" y="160" fill="#a8b5c7">Symbols</text>
    <rect x="845" y="142" width="210" height="26" rx="5" fill="#0b1424" stroke="#33445e"/>
    <text x="950" y="160" fill="#ffffff" text-anchor="middle" font-family="Consolas, monospace">SPY, QQQ, ...</text>
    <text x="680" y="200" fill="#a8b5c7">Risk mode</text>
    <rect x="845" y="182" width="210" height="26" rx="5" fill="#12345c" stroke="#2563eb"/>
    <text x="950" y="200" fill="#ffffff" text-anchor="middle" font-family="Consolas, monospace">% Equity</text>
    <text x="680" y="240" fill="#a8b5c7">Equity percent</text>
    <rect x="845" y="222" width="210" height="26" rx="5" fill="#0b1424" stroke="#33445e"/>
    <text x="950" y="240" fill="#ffffff" text-anchor="middle" font-family="Consolas, monospace">user configured</text>
    <text x="680" y="280" fill="#a8b5c7">Max allocation</text>
    <rect x="845" y="262" width="210" height="26" rx="5" fill="#0b1424" stroke="#33445e"/>
    <text x="950" y="280" fill="#ffffff" text-anchor="middle" font-family="Consolas, monospace">guarded</text>
    <text x="680" y="320" fill="#a8b5c7">Trade window</text>
    <rect x="845" y="302" width="98" height="26" rx="5" fill="#0b1424" stroke="#33445e"/>
    <rect x="957" y="302" width="98" height="26" rx="5" fill="#0b1424" stroke="#33445e"/>
    <text x="894" y="320" fill="#ffffff" text-anchor="middle" font-family="Consolas, monospace">09:30</text>
    <text x="1006" y="320" fill="#ffffff" text-anchor="middle" font-family="Consolas, monospace">15:55</text>
    <text x="680" y="360" fill="#a8b5c7">Prior-day guard</text>
    <rect x="845" y="343" width="18" height="18" rx="3" fill="#0b1424" stroke="#33445e"/>
    <text x="875" y="360" fill="#a8b5c7">optional</text>
    <text x="680" y="400" fill="#a8b5c7">Paper/live toggle</text>
    <rect x="845" y="383" width="18" height="18" rx="3" fill="#0b1424" stroke="#33445e"/>
    <text x="875" y="400" fill="#a8b5c7">paper-first guardrail</text>
  </g>
  <rect x="680" y="455" width="375" height="42" rx="7" fill="#2563eb"/>
  <text x="867" y="482" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Apply Settings</text>
  <text x="120" y="560" fill="#64748b" font-family="Consolas, monospace" font-size="13">Exact thresholds and implementation details remain private in the public page.</text>
</svg>
